<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>에스라, 이젠 안녕</title>
  <meta name="theme-color" content="#0d1530">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 밤하늘 배경: 별 + 산 + 불빛 -->
  <div class="sky" aria-hidden="true">
    <div id="stars" class="stars"></div>
    <svg class="mountain" viewBox="0 0 1920 260" preserveAspectRatio="none">
      <path d="M0 120 L36 114 L185 130 L335 80 L528 98 L680 52 L830 33 L960 0 L1085 32 L1240 55 L1390 95 L1560 76 L1735 120 L1885 105 L1920 112 L1920 260 L0 260 Z"/>
    </svg>
    <div id="lights" class="lights"></div>
    <p class="signature">Ezra <small>2026</small></p>
  </div>

  <main class="page">
    <p class="eyebrow">에스라 다락방 · 마지막 순모임</p>
    <h1 class="title">에스라,<br>이젠 안녕</h1>

    <section id="heroWord" class="hero-word">
      <p>너희는 세상의 빛이다.</p>
      <p>산 위에 세워진 도시는 숨겨질 수 없다.</p>
      <p class="hero-ref">마태복음 5장 14절</p>
    </section>

    <section id="card" class="card hidden" aria-live="polite">
      <p class="greeting"><span id="who"></span> 순장님께 주시는 말씀</p>
      <blockquote id="verse" class="verse"></blockquote>
      <p id="ref" class="ref"></p>
      <p id="message" class="message"></p>

      <div id="prayerBox" class="prayer hidden">
        <button id="prayerBtn" class="prayer-btn" type="button">🙏 <span id="prayerWho"></span> 순장님을 위한 기도 듣기</button>
        <p id="prayerState" class="prayer-state"></p>
      </div>

      <div id="player" class="player hidden">
        <button id="playBtn" class="play-btn" type="button" aria-label="재생/일시정지">❚❚</button>
        <span class="player-label">말씀과 함께 듣는 찬양</span>
      </div>

      <button id="again" class="link-btn" type="button">다른 이름으로 보기</button>
    </section>
  </main>

  <!-- 이름 입력 팝업 -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <form id="nameForm" class="modal-box" autocomplete="off">
      <h2 id="modalTitle">순장님, 환영합니다</h2>
      <p class="modal-desc">이름을 입력해 주세요</p>
      <input id="nameInput" type="text" placeholder="이름" maxlength="20" required>
      <button type="submit" class="primary-btn">말씀 받기</button>
      <p class="hint">🔊 소리를 켜 주세요</p>
    </form>
  </div>

  <audio id="audio" loop preload="auto" playsinline></audio>
  <audio id="prayer" preload="auto" playsinline></audio>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
